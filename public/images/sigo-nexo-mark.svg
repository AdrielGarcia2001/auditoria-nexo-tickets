      <rect x="-3.4" y="-27" width="6.8" height="8" rx="2"/>
      <rect x="-3.4" y="19" width="6.8" height="8" rx="2"/>
      <rect x="-27" y="-3.4" width="8" height="6.8" rx="2"/>
      <rect x="19" y="-3.4" width="8" height="6.8" rx="2"/>
      <rect x="-21" y="-21" width="7" height="7" rx="1.6" transform="rotate(45 -17.5 -17.5)"/>
      <rect x="14" y="14" width="7" height="7" rx="1.6" transform="rotate(45 17.5 17.5)"/>
      <rect x="14" y="-21" width="7" height="7" rx="1.6" transform="rotate(-45 17.5 -17.5)"/>
      <rect x="-21" y="14" width="7" height="7" rx="1.6" transform="rotate(-45 -17.5 17.5)"/>
    </g>
    <circle r="9" fill="#ffffff"/>
    <!-- llave inglesa -->
